name: CI

on:
  push:
  pull_request:
  release:
    types:
      - created
jobs:
  build-osx:    
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: build robotraconteur
      run: |
        brew tap robotraconteur/local $GITHUB_WORKSPACE
        brew install robotraconteur/local/robotraconteur

    
